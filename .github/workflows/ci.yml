# Next.js CI/CD Pipeline for CropFresh Web Dashboard
# This workflow runs on every push and pull request
# It lints, builds, and prepares for deployment

name: CI

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]

env:
    NODE_VERSION: "22"

jobs:
    # ============================================
    # JOB 1: Lint & Build
    # ============================================
    lint-and-build:
        name: Lint & Build
        runs-on: ubuntu-latest

        steps:
            # Step 1: Checkout code
            - name: Checkout repository
              uses: actions/checkout@v4

            # Step 2: Setup Node.js with caching
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "npm"

            # Step 3: Install dependencies
            - name: Install dependencies
              run: npm ci

            # Step 4: Run lint
            - name: Lint
              run: npm run lint || echo "No lint script configured"

            # Step 5: Build for production
            - name: Build
              run: npm run build

            # Step 6: Upload build artifacts (on main branch)
            - name: Upload build artifacts
              if: github.ref == 'refs/heads/main' && github.event_name == 'push'
              uses: actions/upload-artifact@v4
              with:
                  name: dashboard-build
                  path: .next/
                  retention-days: 7
